name: ClassIQ Continuous Integration Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Test Backend & Build Client
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install Backend Dependencies
        run: cd server && npm ci

      - name: Run Backend Unit & Integration Tests
        env:
          PORT: 5000
          NODE_ENV: test
          MONGO_URI: mongodb://localhost:27017/classiq_test
          JWT_ACCESS_SECRET: test_jwt_access_secret_key_2026_min_16_chars
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_key_2026_min_16_chars
          ATTENDANCE_HMAC_SECRET: test_attendance_hmac_secret_key_min_32_bytes_long
        run: cd server && npm test

      - name: Install Client Dependencies
        run: cd client && npm ci

      - name: Build Vite Client Production Bundle
        run: cd client && npm run build
